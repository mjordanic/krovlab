[project]
name = "krovlab"
version = "0.1.0"
description = "Roof geometry from a building footprint, via a weighted straight skeleton"
readme = "README.md"
authors = [
    { name = "Mislav Jordanic", email = "mislav.jordanic@gmail.com" }
]
requires-python = ">=3.13"

# The core stays dependency-free on purpose: it takes data and returns data, so
# it can later be embedded in a server, a notebook, or compiled to the browser
# without dragging anything with it. Everything else is an extra.
dependencies = []

[project.optional-dependencies]
viz = ["plotly>=5.24", "nbformat>=5.10"]
notebooks = ["ipykernel>=6.29", "plotly>=5.24", "nbformat>=5.10"]
web = [
    "flask>=3.1",
    "nbformat>=5.10",
    "plotly>=5.24",
    "google-genai>=1.16",
    "python-dotenv>=1.2.3",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "hypothesis>=6.112",
    # An independent oracle for test assertions only. Never imported by the
    # core: if shapely and our own geometry agree, that means something.
    "shapely>=2.1",
    "ruff>=0.7",
    "mypy>=1.13",
    "plotly>=5.24",
    "nbformat>=5.10",
    "ipykernel>=6.29",
    "flask>=3.1",
    "google-genai>=1.16",
    "python-dotenv>=1.2.3",
]

[build-system]
requires = ["uv_build>=0.11.13,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 88
src = ["src", "tests", "web"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests", "web"]
